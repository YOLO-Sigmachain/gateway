# Connector ergodex: AMM swaps on Ergo through venue modules: Spectrum-style pools and
# LithosDex pools (each ERG/token and token/token), traded by spending the pool box in
# the trader's own transaction.

# Default slippage percentage between quote and execute (1 = 1%). Amounts are fixed in
# an Ergo transaction, so this bounds how far the pool may move before the swap is built.
slippagePct: 1

# When the node rejects a swap because the pool box was already spent: how many times to
# re-read the pool, re-quote and rebuild (only while the slippage bound still holds).
maxRebuilds: 2

# When the pool box is spent by one of this gateway's own pending swaps: milliseconds to
# wait before rebuild n (times n), so the node can list that swap's successor box.
rebuildWaitMs: 500

# The swap routes never read Gateway's pool list (pools/ergo/<network>.json) for ergodex:
# without a pool address, ergodex chooses the allowed pool with the best result for the
# size. The pool list serves /pools lookups only.

# Per network. A network with no entry, or with empty tree lists, has no pools.
networks:
  mainnet:
    # Build on the newest unconfirmed successor of a pool box from the node's mempool
    # (true), or only on the confirmed box (false).
    useMempoolSuccessor: true
    # Pools charging a higher fee (percent) are refused when named and skipped when chosen.
    maxPoolFeePct: 3
    # Pools with less native coin (nanoERG) than this are refused or skipped (100 ERG).
    minPoolNativeReserve: 100000000000
    # Pools with any token reserve below this are refused or skipped. In raw units (the
    # token's smallest unit), and the same number for every token whatever its decimals.
    # This is the only size guard on a token/token pool: minPoolNativeReserve never
    # applies there.
    minPoolTokenReserve: 1
    # If not empty, only these pools (pool NFT ids) may be traded, of any venue. A
    # LithosDex pool must also be on lithos.poolAllowlist below when that list is not empty.
    poolAllowlist: []
    # Most boxes read per pool tree (or LithosDex template) when discovering pools. One
    # holding more is read in part, with a warning in the log.
    maxDiscoveredBoxes: 5000
    spectrum:
      # Exact ErgoTrees of the live pools (read from the node 2026-11-25). A box is a pool
      # only at one of these trees.
      n2tPoolTrees:
        - ''
      t2tPoolTrees:
        - ''
      # The pool contracts' fee denominator (R4 is the numerator, per pool).
      feeDenominator: 1000
      # An ERG/token pool's successor must hold more than this many nanoERG.
      n2tMinSuccessorValue: 10000000
      # The pool contracts' LP constant: a pool's LP supply is this minus the LP tokens it
      # holds. Needed for liquidity (quote, add, remove, positions); without it those
      # routes answer 501 and swaps work as before. Quoted: beyond a JS number.
      lockedLiquidity: '9223372036854775807'
    # LithosDex pools (ERG/token and token/token), traded by direct swap: the trader's own
    # transaction spends the pool box. Every deployment is the same pinned contract
    # templates below with its own ids written in place of the sentinel terms; these are
    # the templates the Lithos client pins (lithos-lib LDContracts, client 1.0.8).
    # Pools are found on chain by template hash (see poolTemplateHash below) and admitted
    # by the same rules as Spectrum-style pools: the deployment check (its tree and its
    # single vault rebuilt from its own ids), a pool NFT minted as one unit, and the
    # guards above (maxPoolFeePct, minPoolNativeReserve, minPoolTokenReserve,
    # poolAllowlist).
    lithos:
      # true: LithosDex pools are discovered by template hash and every one that passes
      # the rules is used, unless poolAllowlist below lists pools. false: no LithosDex pool
      # is discovered; only the pools on poolAllowlist are used, and none when it is empty.
      # Upgrade note: a config written before this key existed has poolAllowlist: [],
      # which used to offer no LithosDex pool. When it loads, this key is filled in from
      # this template as true, so that config now discovers pools. Set discoverPools: false
      # to keep LithosDex off.
      discoverPools: true
      # Optional restriction, as the top-level poolAllowlist. Empty: with discoverPools,
      # every LithosDex pool that passes the rules is used (pool info, quote, swap, pool
      # choice); without it, none. Not empty: only these pool NFT ids, and they must still
      # pass the rules; pools are then not discovered. Neither the rules nor the check
      # prove how a pool was minted (its genesis), as for a Spectrum-style pool.
      poolAllowlist: []
      # The pool contracts' fee denominator (R5 holds the numerators).
      feeDenominator: 10000
      # Scale of the fee accumulators R7 and R8 (10^27), and the liquidity constant that
      # R4 counts down from (supply = lockedLiquidity - R4). Quoted: beyond a JS number.
      accumulatorScale: '1000000000000000000000000000'
      lockedLiquidity: '9223372036854775807'
      # An ERG/token pool's successor must hold more than this many nanoERG.
      n2tMinSuccessorValue: 10000000
      # Context variable 0 of the pool input names the operation; a swap is 0.
      swapOperation: 0
      # The 32-byte values the templates hold in place of each deployment's ids and hashes.
      sentinels:
        poolNft: '5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d5d'
        vaultNft: '5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e'
        provisionToken: '5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f'
        provisionLogicHash: '6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c'
        provisionGuardHash: '6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d6d'
      # The script every provision box carries; names the hash of the provision logic.
      provisionGuardTree: '1b31010e206c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6c6cea02d193cbe4e3400e7300d40840'
      n2t:
        # LD_LiquidityPool (terms: vault NFT, provision guard hash).
        poolTree: ''
        # LD_FeeVault (terms: pool NFT, provision token).
        feeVaultTree: ''
        # LD_Provision as the guard hashes it: its expression with every constant written
        # in place (terms: pool NFT, vault NFT).
        provisionLogicValue: ''
        # The node's template hash of poolTree (blake2b256 of the tree with its constants
        # taken out): every ERG/token pool is found under it. Must match poolTree.
        poolTemplateHash: '76fb608217788427bc0ee0c4f7319982b618d98857ba5c1c8753b2c12ee4c139'
      t2t:
        # LD_T2T_LiquidityPool (terms: vault NFT, provision guard hash).
        poolTree: ''
        # LD_T2T_FeeVault (terms: pool NFT, provision token).
        feeVaultTree: ''
        # LD_T2T_Provision with every constant written in place (terms: pool NFT, vault NFT).
        provisionLogicValue: ''
        # The node's template hash of poolTree: every token/token pool is found under it.
        poolTemplateHash: '4b8ced39b69eb50b2474e8399034111bb7be6c49055110cd0396f0fe1570055a'
  testnet:
    useMempoolSuccessor: true
    maxPoolFeePct: 3
    minPoolNativeReserve: 0
    minPoolTokenReserve: 1
    poolAllowlist: []
    maxDiscoveredBoxes: 5000
    spectrum:
      # No pool trees are known for this network.
      n2tPoolTrees: []
      t2tPoolTrees: []
      feeDenominator: 1000
      n2tMinSuccessorValue: 10000000
      lockedLiquidity: '9223372036854775807'
