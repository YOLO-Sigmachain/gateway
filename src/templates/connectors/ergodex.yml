# Connector ergodex: AMM swaps on Ergo through venue modules. The first venue is
# Spectrum-style pools (ERG/token and token/token), traded by spending the pool box in
# the trader's own transaction.

# Default slippage percentage between quote and execute (1 = 1%). Amounts are fixed in
# an Ergo transaction, so this bounds how far the pool may move before the swap is built.
slippagePct: 1

# When the node rejects a swap because the pool box was already spent: how many times to
# re-read the pool, re-quote and rebuild (only while the slippage bound still holds).
maxRebuilds: 2

# When the pool box is spent by one of this gateway's own pending swaps: milliseconds to
# wait before rebuild n (times n), so the node can list that swap's successor box.
rebuildWaitMs: 500

# The swap routes never read Gateway's pool list (pools/ergo/<network>.json) for ergodex:
# without a pool address, ergodex chooses the allowed pool with the best result for the
# size. The pool list serves /pools lookups only.

# Per network. A network with no entry, or with empty tree lists, has no pools.
networks:
  mainnet:
    # Build on the newest unconfirmed successor of a pool box from the node's mempool
    # (true), or only on the confirmed box (false).
    useMempoolSuccessor: true
    # Pools charging a higher fee (percent) are refused when named and skipped when chosen.
    maxPoolFeePct: 3
    # Pools with less native coin (nanoERG) than this are refused or skipped (100 ERG).
    minPoolNativeReserve: 100000000000
    # Pools with any token reserve below this are refused or skipped. In raw units (the
    # token's smallest unit), and the same number for every token whatever its decimals.
    # This is the only size guard on a token/token pool: minPoolNativeReserve never
    # applies there.
    minPoolTokenReserve: 1
    # If not empty, only these pools (pool NFT ids) may be traded.
    poolAllowlist: []
    # Most boxes read per pool tree when discovering pools. A tree holding more is read in
    # part, with a warning in the log.
    maxDiscoveredBoxes: 5000
    spectrum:
      # Exact ErgoTrees of the live pools (read from the node 2026-11-25). A box is a pool
      # only at one of these trees.
      n2tPoolTrees:
        - ''
      t2tPoolTrees:
        - ''
      # The pool contracts' fee denominator (R4 is the numerator, per pool).
      feeDenominator: 1000
      # An ERG/token pool's successor must hold more than this many nanoERG.
      n2tMinSuccessorValue: 10000000
  testnet:
    useMempoolSuccessor: true
    maxPoolFeePct: 3
    minPoolNativeReserve: 0
    minPoolTokenReserve: 1
    poolAllowlist: []
    maxDiscoveredBoxes: 5000
    spectrum:
      # No pool trees are known for this network.
      n2tPoolTrees: []
      t2tPoolTrees: []
      feeDenominator: 1000
      n2tMinSuccessorValue: 10000000
