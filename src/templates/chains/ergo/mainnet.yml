# Ergo node with the extra indexer enabled (the /blockchain API). Every read and every
# submit goes to this node; no explorer is used.
nodeURL: http://127.0.0.1:9053

# Network prefix used to encode and check addresses (0 mainnet, 16 testnet).
# Taken from this file only, never from the node's /info.
addressPrefix: 0

nativeCurrencySymbol: ERG
nativeDecimals: 9

# Miner fee per transaction, in the smallest unit of the native currency (nanoERG)
minerFee: 1100000

# Highest miner fee any transaction may pay, in nanoERG. A connector or request asking for
# more (or for less than minerFee) is refused before signing. Defaults to 10 x minerFee.
maxMinerFee: 11000000

# ErgoTree (hex) of the miner fee output
minerFeeErgoTree: 1005040004000e36100204a00b08cd0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798ea02d192a39a8cc7a701730073011001020402d19683030193a38cc7b2a57300000193c2b2a57301007473027303830108cdeeac93b1a57304

# Token list file, relative to conf/
tokenListSource: tokens/ergo/mainnet.json

# Average block interval in seconds. A pending transaction older than
# pendingTxTimeoutBlocks blocks of this length is checked against the node when boxes are
# next selected, at most once per block. It is never forgotten for its age while its inputs
# are unspent. It leaves only when it is confirmed; when it is shown failed (an input spent
# by another transaction that has `failedAfterConfirmations` confirmations, or it spends
# an output of a transaction that failed so); once past that age, when an input is known
# neither to the node's index nor as an output of a transaction Gateway tracks; or
# when the node refuses it at its first submit. A dropped one is posted again; one the node refuses
# when posted again is kept and tried again later.
blockTimeSeconds: 120
pendingTxTimeoutBlocks: 15

# File that keeps this network's pending transactions across restarts, relative to the
# Gateway folder. It holds signed transactions and box ids only, never a key. Each network
# needs its own file (Gateway does not start on another network's file), and two Gateway
# processes must not share one: each would overwrite the other's entries.
pendingStateFile: db/ergo/mainnet-pending.json

# Ergo transactions carry no expiry: a signed transaction stays valid until one of its
# inputs is spent, however long it waits, so "not found" never proves it can no longer
# confirm. Stated for clients; Gateway itself does not read it.
transactionsExpire: false

# Number of blocks on top of (and including) the one holding a transaction before poll
# reports it as confirmed
confirmations: 1

# How many confirmations the transaction that spent one of our inputs needs before ours is
# reported failed. A reorganisation shallower than this cannot turn a reported failure into
# a confirmed trade. A larger value is safer, and reports a lost race later (about
# blockTimeSeconds per confirmation). Unset: the value of confirmations.
failedAfterConfirmations: 3

# Node request timeout in milliseconds, and page size for box queries
nodeTimeoutMs: 10000
boxPageSize: 100

# What happens to a signed transaction. Three states:
# - submitMode: send. It is submitted to the node, which relays it to the network.
# - submitMode: check. The node only checks it (it must be valid against the node's current
#   boxes, scripts included) and nothing is sent; a swap or transfer then answers an error
#   that names the transaction id and says nothing was sent, and nothing is tracked. Use it
#   for a dry run with a real wallet before sending anything. The node at nodeURL receives
#   the signed transaction in full, so in this mode it must be on this machine (see
#   checkAllowsRemoteNode below).
# - not set (no submitMode line). Nothing is signed, sent or checked: every swap and
#   transfer is refused with an error that says to set it. A fresh config sends nothing
#   until this key is set.
# The key is read only as submitMode, at the top level of this file; a key spelled like it
# elsewhere in this file or in conf/chains/ergo.yml stops the network. Change it only with
# Gateway stopped, then start Gateway.
# submitMode: check    # or: submitMode: send

# In check mode the network starts only when nodeURL is on this machine (localhost,
# 127.0.0.0/8 or ::1): whoever runs or can watch a remote node could broadcast the signed
# transactions it is handed. Set this to true only for a remote node you trust with that.
# checkAllowsRemoteNode: true

# Default connector for the unified trading routes when a request names none
# (format: connector/type)
swapProvider: ergodex/amm
