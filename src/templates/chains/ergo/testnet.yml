# Ergo node with the extra indexer enabled (the /blockchain API). Every read and every
# submit goes to this node; no explorer is used.
nodeURL: http://127.0.0.1:9052

# Network prefix used to encode and check addresses (0 mainnet, 16 testnet).
# Taken from this file only, never from the node's /info.
addressPrefix: 16

nativeCurrencySymbol: ERG
nativeDecimals: 9

# Miner fee per transaction, in the smallest unit of the native currency (nanoERG)
minerFee: 1100000

# Highest miner fee any transaction may pay, in nanoERG. A connector or request asking for
# more (or for less than minerFee) is refused before signing. Defaults to 10 x minerFee.
maxMinerFee: 11000000

# ErgoTree (hex) of the miner fee output
minerFeeErgoTree: 1005040004000e36100204a00b08cd0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798ea02d192a39a8cc7a701730073011001020402d19683030193a38cc7b2a57300000193c2b2a57301007473027303830108cdeeac93b1a57304

# Token list file, relative to conf/
tokenListSource: tokens/ergo/testnet.json

# Average block interval in seconds. A pending transaction older than
# pendingTxTimeoutBlocks blocks of this length is checked against the node when boxes are
# next selected; it is forgotten only on evidence (confirmed, or an input spent by another
# transaction), never for its age while its inputs are unspent.
blockTimeSeconds: 120
pendingTxTimeoutBlocks: 15

# File that keeps this network's pending transactions across restarts, relative to the
# Gateway folder. It holds signed transactions and box ids only, never a key.
pendingStateFile: db/ergo/testnet-pending.json

# Ergo transactions carry no expiry: a signed transaction stays valid until one of its
# inputs is spent, however long it waits, so "not found" never proves it can no longer
# confirm. Stated for clients; Gateway itself does not read it.
transactionsExpire: false

# Number of blocks on top of (and including) the one holding a transaction before poll
# reports it as confirmed
confirmations: 1

# Node request timeout in milliseconds, and page size for box queries
nodeTimeoutMs: 10000
boxPageSize: 100

# Default connector for the unified trading routes when a request names none
# (format: connector/type)
swapProvider: ergodex/amm
